  <rect width="960" height="360" rx="18" fill="#10131a"/>
  <circle cx="40" cy="35" r="8" fill="#ff605c"/><circle cx="66" cy="35" r="8" fill="#ffbd44"/><circle cx="92" cy="35" r="8" fill="#00ca4e"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e6edf3">
