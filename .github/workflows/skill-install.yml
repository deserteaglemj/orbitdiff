name: Skill installation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build exact candidate artifacts
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build --wheel --outdir "$RUNNER_TEMP/orbit-candidate"
          python scripts/build_skill.py --output-dir "$RUNNER_TEMP/orbit-candidate"
          python scripts/package_audit.py "$RUNNER_TEMP"/orbit-candidate/*.whl "$RUNNER_TEMP"/orbit-candidate/orbitdiff-skill-*.zip
      - name: Verify clean installed runtime and complete skill
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "orbit-candidate"
          wheel, = artifacts.glob("*.whl")
          skill, = artifacts.glob("orbitdiff-skill-*.zip")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          subprocess.run([
              sys.executable, "scripts/check_skill_install.py", "--wheel", str(wheel),
              "--skill-archive", str(skill), "--source-commit", os.environ["GITHUB_SHA"],
              "--expected-version", version, "--provenance", "candidate",
              "--output-dir", str(Path(os.environ["RUNNER_TEMP"]) / "orbit-skill-install"),
          ], check=True, timeout=300)
          PY
      - name: Retain installation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-skill-installation
          path: ${{ runner.temp }}/orbit-skill-install/install-receipt.json
          if-no-files-found: warn
          retention-days: 14
