name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Audit package contents
        run: python scripts/package_audit.py dist/*
      - name: Audit dependencies
        run: python -m pip check
      - name: Public-safety scan
        run: python scripts/public_safety_scan.py .
      - name: Validate Agent Skill
        run: gh skill publish --dry-run .
