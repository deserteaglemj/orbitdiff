[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitdiff"
version = "0.2.3"
description = "Orbit OS local relationship app and portable OrbitDiff Agent Skill"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "OrbitDiff contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "instaloader>=4.15.3,<5",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.2,<7"]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.168.3,<7",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
orbitdiff = "orbitdiff.cli:main"
orbit-os = "orbit_os.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbitdiff = ["fixtures/*.json"]
orbit_os = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.webmanifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
